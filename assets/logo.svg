<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-labelledby="ycl-logo-title ycl-logo-desc">
  <title id="ycl-logo-title">YCL | YutupCutLoad</title>
  <desc id="ycl-logo-desc">Logo horizontal YCL | YutupCutLoad: ikon play video dengan garis potong diagonal dan tipografi wordmark di atas panel gelap.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12151b" />
      <stop offset="100%" stop-color="#0d0f12" />
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="cutBeam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Outer Dark Card -->
  <rect x="2" y="2" width="636" height="156" rx="20" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2" />

  <!-- Subtle Timeline Grid Accent on Right Edge -->
  <rect x="44" y="132" width="104" height="6" rx="3" fill="#1e2430" />
  <rect x="64" y="132" width="44" height="6" rx="3" fill="#e11d48" opacity="0.85" />
  <rect x="114" y="132" width="18" height="6" rx="3" fill="#10b981" opacity="0.85" />

  <!-- Left Icon Emblem -->
  <g transform="translate(36, 24)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#tileGrad)" stroke="#fb7185" stroke-opacity="0.35" stroke-width="1.5" />

    <!-- Sliced Play Triangle (Top-Left Piece) -->
    <path d="M 33 27 L 69 47 L 55 55 L 33 41 Z" fill="#ffffff" />
    <!-- Sliced Play Triangle (Bottom-Right Piece, Slightly Offset) -->
    <path d="M 35 47 L 57 60 L 35 72 Z" fill="#ffe4e6" />

    <!-- Diagonal Scissor / Cut Blade Accent -->
    <line x1="20" y1="74" x2="78" y2="26" stroke="#0d0f12" stroke-width="7" stroke-linecap="round" />
    <line x1="20" y1="74" x2="78" y2="26" stroke="url(#cutBeam)" stroke-width="3" stroke-linecap="round" />

    <!-- Cut Tick Markers -->
    <circle cx="24" cy="24" r="3" fill="#fda4af" opacity="0.9" />
    <circle cx="72" cy="72" r="3" fill="#fda4af" opacity="0.9" />
  </g>

  <!-- Wordmark Section -->
  <g transform="translate(158, 0)" font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- YCL Pill Badge -->
    <rect x="0" y="39" width="76" height="36" rx="9" fill="#e11d48" fill-opacity="0.16" stroke="#fb7185" stroke-opacity="0.45" stroke-width="1.5" />
    <text x="38" y="64" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="1.5" fill="#fb7185">YCL</text>

    <!-- Pipe Separator -->
    <rect x="92" y="42" width="2.5" height="30" rx="1.25" fill="#3f3f46" />

    <!-- Main App Name -->
    <text x="112" y="67" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#f4f4f5">
      Yutup<tspan fill="#fb7185">Cut</tspan>Load
    </text>

    <!-- Subtitle -->
    <text x="2" y="102" font-size="14.5" font-weight="500" letter-spacing="0.2" fill="#a1a1aa">
      Partial YouTube &amp; Livestream VOD Clip Downloader
    </text>

    <!-- Minimal Feature Pills -->
    <g transform="translate(2, 117)" font-size="11" font-weight="600">
      <rect x="0" y="0" width="74" height="22" rx="6" fill="#181c24" stroke="#27272a" stroke-width="1" />
      <text x="37" y="15" text-anchor="middle" fill="#d4d4d8">Tauri v2</text>

      <rect x="82" y="0" width="104" height="22" rx="6" fill="#181c24" stroke="#27272a" stroke-width="1" />
      <text x="134" y="15" text-anchor="middle" fill="#d4d4d8">yt-dlp + ffmpeg</text>

      <rect x="194" y="0" width="98" height="22" rx="6" fill="#181c24" stroke="#27272a" stroke-width="1" />
      <text x="243" y="15" text-anchor="middle" fill="#d4d4d8">Windows x64</text>
    </g>
  </g>
</svg>
